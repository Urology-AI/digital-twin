# Builds the web app (dist/) and deploys it with the Worker in cf-worker/,
# which serves it as Workers static assets on digital-twin.urology.edu.eu.org.
# Needs repo secrets CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, Workers
# Routes:Edit on the zone) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: cf-worker
      - run: npx wrangler deploy
        working-directory: cf-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
