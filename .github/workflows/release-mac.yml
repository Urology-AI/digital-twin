name: Release desktop apps

# Triggered by a `vX.Y.Z` tag — pushed by hand, by `npm version patch`, or
# automatically by auto-release.yml on every merge to main that touches app
# code. The build version comes from the tag, not package.json.
# Run manually (workflow_dispatch) with `preflight` to only check the
# signing/notarization secrets without building.
#
# Three jobs: build (sign + notarize + staple on macos-14), verify (cold
# Gatekeeper check on a SEPARATE macos-15 runner that never touched the
# notarization — so its verdict reflects what a user's Mac sees, not a warm
# local cache), publish (only if verify passed).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      preflight:
        description: "Only check secrets, don't build"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-14
    outputs:
      ver: ${{ steps.ver.outputs.v }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — validate signing & notarization secrets
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASES_WRITE_PAT: ${{ secrets.RELEASES_WRITE_PAT }}
          RELEASES_READ_PAT: ${{ secrets.RELEASES_READ_PAT }}
        run: |
          set -e
          fail=0
          for v in MAC_CERT_P12 MAC_CERT_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID RELEASES_WRITE_PAT RELEASES_READ_PAT; do
            if [ -z "${!v}" ]; then echo "::error::$v is empty"; fail=1; else echo "$v: set"; fi
          done
          [ "$fail" = 0 ] || exit 1

          echo "$MAC_CERT_P12" | base64 --decode > cert.p12
          echo "cert.p12 size: $(wc -c < cert.p12) bytes"
          # Validates both that the .p12 is well-formed and that MAC_CERT_PASSWORD is correct.
          openssl pkcs12 -in cert.p12 -nodes -passin env:MAC_CERT_PASSWORD -clcerts 2>/dev/null \
            | openssl x509 -noout -subject -enddate
          echo "→ certificate + password OK"

          # Confirms APPLE_ID / app-specific password / team id are accepted by Apple.
          xcrun notarytool history --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            | head -5
          echo "→ notarization credentials OK"
          rm cert.p12

          # Confirms both release-repo tokens can reach the private repo.
          for pat in RELEASES_WRITE_PAT RELEASES_READ_PAT; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${!pat}" \
              https://api.github.com/repos/Urology-AI/digital-twin-releases)
            [ "$code" = 200 ] && echo "→ $pat reaches digital-twin-releases OK" \
              || { echo "::error::$pat cannot read digital-twin-releases (HTTP $code)"; exit 1; }
          done

          # The update feed is the Cloudflare Worker, which reads the release
          # assets with this same token (held as a Worker secret — the app
          # itself ships with no credential). Exercise the exact path the
          # Worker takes, so a token that can see the repo but not its
          # releases/assets fails here rather than in the field.
          rel=$(curl -s -H "Authorization: Bearer $RELEASES_READ_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Urology-AI/digital-twin-releases/releases/latest)
          asset=$(echo "$rel" | python3 -c 'import json,sys;r=json.load(sys.stdin);print(next((a["url"] for a in r.get("assets",[]) if a["name"]=="latest-mac.yml"),""))')
          [ -n "$asset" ] || { echo "::error::RELEASES_READ_PAT: no latest-mac.yml on the latest release ($(echo "$rel" | head -c 200))"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -L \
            -H "Authorization: Bearer $RELEASES_READ_PAT" \
            -H "Accept: application/octet-stream" "$asset")
          [ "$code" = 200 ] && echo "→ RELEASES_READ_PAT can download the update feed OK" \
            || { echo "::error::RELEASES_READ_PAT cannot download latest-mac.yml (HTTP $code)"; exit 1; }

      - name: Stop here if preflight-only
        if: ${{ inputs.preflight }}
        run: echo "Preflight passed. Re-run without preflight (or push a tag) to build." && exit 0

      - uses: actions/setup-node@v7
        if: ${{ !inputs.preflight }}
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: ${{ !inputs.preflight }}

      - run: npm run typecheck && npm test
        if: ${{ !inputs.preflight }}

      - name: Resolve version
        if: ${{ !inputs.preflight }}
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(node -p 'require("./package.json").version')"
          fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"

      # `hdiutil create` is flaky on GitHub's macOS runners while Spotlight is
      # indexing the freshly-checked-out tree; disabling it makes the DMG build
      # reliable.
      - name: Disable Spotlight (hdiutil reliability)
        if: ${{ !inputs.preflight }}
        run: sudo mdutil -a -i off || true

      - name: Build, sign, notarize, staple
        if: ${{ !inputs.preflight }}
        run: |
          for attempt in 1 2 3; do
            echo "::group::electron-builder attempt $attempt"
            npm run dist:mac -- --publish never -c.extraMetadata.version=${{ steps.ver.outputs.v }} && { echo "::endgroup::"; ok=1; break; }
            echo "::endgroup::"
            echo "attempt $attempt failed; cleaning up and retrying in 20s"
            rm -rf release
            hdiutil info | grep -o '/Volumes/COMPASS[^"]*' | while read -r v; do hdiutil detach "$v" -force || true; done
            sleep 20
          done
          [ "$ok" = 1 ] || exit 1
        env:
          VITE_APP_VERSION: ${{ steps.ver.outputs.v }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Stapling rewrites the .dmg, so the sha512/size electron-builder recorded
      # for it are stale. notarize-artifacts.cjs tries to patch them, but
      # electron-builder writes latest-mac.yml AFTER that hook runs, so the
      # patch silently found no file and v1.0.21 shipped a manifest 1984 bytes
      # out of date for the .dmg. Do it here, where both definitely exist.
      # (The .zip entry — the one auto-update actually consumes — is untouched.)
      - name: Patch latest-mac.yml with the stapled .dmg hash
        if: ${{ !inputs.preflight }}
        run: node electron/patch-dmg-hash.cjs release

      - name: Upload release artifacts
        if: ${{ !inputs.preflight }}
        uses: actions/upload-artifact@v4
        with:
          name: release-mac
          if-no-files-found: error
          path: |
            release/COMPASS-Digital-Twin-*-arm64.dmg
            release/COMPASS-Digital-Twin-*-arm64.zip
            release/COMPASS-Digital-Twin-*-arm64.zip.blockmap
            release/latest-mac.yml

  # Cold Gatekeeper check on a runner that never performed the notarization,
  # with Apple's online notarization endpoints blocked — so `stapler` and
  # `spctl` can only succeed from an embedded (stapled) ticket, exactly like a
  # user's Mac opening the download offline. The old in-job check passed off a
  # warm local cache and shipped un-notarized builds for three releases.
  verify:
    needs: build
    if: ${{ !inputs.preflight }}
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-mac
          path: art

      - name: Block Apple's online notarization endpoints
        run: |
          sudo tee -a /etc/hosts >/dev/null <<'EOF'
          0.0.0.0 valid.apple.com
          0.0.0.0 api.apple-cloudkit.com
          0.0.0.0 ocsp.apple.com
          0.0.0.0 ocsp2.apple.com
          EOF
          sudo dscacheutil -flushcache || true
          sudo killall -HUP mDNSResponder || true

      # `stapler validate` is NOT a usable gate on macOS 15+: it fails on
      # apps Gatekeeper happily accepts (spot-checked against a dozen
      # notarized apps from the App Store's Developer ID world, all of which
      # spctl reports as "Notarized Developer ID" while stapler exits 65).
      # The authoritative pair is `spctl -a -t exec` plus
      # `codesign --test-requirement="=notarized"`; both read the stapled
      # ticket, so with Apple's endpoints blocked they only pass from an
      # embedded ticket — which is exactly the property we want to gate on.
      - name: Verify the .app in the .dmg and .zip is notarized (offline)
        run: |
          set -e
          VER="${{ needs.build.outputs.ver }}"
          DMG="art/COMPASS-Digital-Twin-$VER-arm64.dmg"
          ZIP="art/COMPASS-Digital-Twin-$VER-arm64.zip"

          assert_notarized() {
            local app="$1"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl -a -vvv -t exec "$app"
            codesign --test-requirement="=notarized" --verify --verbose=2 "$app"
          }

          echo "::group::.dmg — the .app inside"
          MP=$(mktemp -d)
          hdiutil attach -nobrowse -quiet -mountpoint "$MP" "$DMG"
          WORK=$(mktemp -d); cp -R "$MP"/*.app "$WORK/"; hdiutil detach "$MP" -quiet
          APP=$(find "$WORK" -maxdepth 1 -name "*.app" -print -quit)
          assert_notarized "$APP"
          echo "::endgroup::"

          echo "::group::.zip — the .app the auto-updater installs"
          UZ=$(mktemp -d); ditto -x -k "$ZIP" "$UZ"
          ZAPP=$(find "$UZ" -maxdepth 1 -name "*.app" -print -quit)
          assert_notarized "$ZAPP"
          echo "::endgroup::"

          # The disk image is signed (dmg.sign in electron-builder.yml) and
          # notarized, so Gatekeeper can assess it on mount. Shipping an
          # unsigned image is what left v1.0.17 showing "no usable signature"
          # here and the malware dialog on a user's Mac — gate on it.
          echo "::group::.dmg — the disk image itself"
          codesign --verify --verbose=2 "$DMG"
          spctl -a -vvv -t open --context context:primary-signature "$DMG"
          # Informational: see the note above on stapler.
          xcrun stapler validate "$DMG" || true
          echo "::endgroup::"

          # latest-mac.yml must describe the artifacts we actually ship. This
          # is the gate that would have caught v1.0.21's stale .dmg entry.
          echo "::group::latest-mac.yml matches the artifacts"
          YML="art/latest-mac.yml"
          check_entry() {
            local file="$1" name; name=$(basename "$file")
            local want_sha want_size got_sha got_size
            want_sha=$(grep -A2 "url: $name\$" "$YML" | sed -n 's/^ *sha512: //p' | head -1)
            want_size=$(grep -A2 "url: $name\$" "$YML" | sed -n 's/^ *size: //p' | head -1)
            got_sha=$(shasum -a 512 "$file" | awk '{print $1}' | xxd -r -p | base64)
            got_size=$(stat -f%z "$file")
            if [ "$want_sha" != "$got_sha" ] || [ "$want_size" != "$got_size" ]; then
              echo "::error::latest-mac.yml disagrees with $name (yml: $want_size bytes, actual: $got_size)"
              exit 1
            fi
            echo "  ✓ $name matches latest-mac.yml ($got_size bytes)"
          }
          check_entry "$DMG"
          check_entry "$ZIP"
          echo "::endgroup::"

          echo "→ v$VER: the .dmg and the .app inside it and in the .zip are signed and notarized (offline-verified on a cold runner), and latest-mac.yml matches both artifacts"

  # Windows installer. Signed when WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD are set
  # (base64 .pfx + its password, an OV/EV code-signing certificate); without
  # them electron-builder still produces a working .exe, but SmartScreen warns
  # every downloader — so treat an unsigned Windows release as a stopgap.
  # There is no Windows equivalent of notarization, hence no verify job.
  build-win:
    if: ${{ !inputs.preflight }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="$(node -p 'require("./package.json").version')"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Build (and sign, if a certificate is configured)
        shell: bash
        run: npm run dist:win -- --publish never -c.extraMetadata.version=${{ steps.ver.outputs.v }}
        env:
          VITE_APP_VERSION: ${{ steps.ver.outputs.v }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Report signing state
        shell: bash
        run: |
          if [ -z "${{ secrets.WIN_CSC_LINK }}" ]; then
            echo "::warning::WIN_CSC_LINK is not set — this installer is UNSIGNED and will trip SmartScreen."
          else
            echo "Installer signed with the configured certificate."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-win
          if-no-files-found: error
          path: |
            release/COMPASS-Digital-Twin-*-x64.exe
            release/COMPASS-Digital-Twin-*-x64.exe.blockmap
            release/latest.yml

  # A Windows failure must not hold back the macOS release, which has been
  # shipping on its own for months: publish runs whenever build + verify pass,
  # and simply includes whatever Windows artifacts exist.
  publish:
    needs: [build, verify, build-win]
    if: ${{ !inputs.preflight && always() && needs.build.result == 'success' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-mac
          path: art

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-win
          path: art

      - name: Publish to the private releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_WRITE_PAT }}
        run: |
          set -e
          VER="${{ needs.build.outputs.ver }}"
          gh release delete "v$VER" --repo Urology-AI/digital-twin-releases --yes --cleanup-tag 2>/dev/null || true
          # Keep only what actually got built: nullglob handles the wildcard
          # entries, and the -f test handles the literal ones (latest.yml has no
          # wildcard, so nullglob alone would pass it through and gh would fail
          # the whole release over a missing Windows manifest).
          shopt -s nullglob
          assets=()
          for f in \
            art/COMPASS-Digital-Twin-*.dmg \
            art/COMPASS-Digital-Twin-*.zip \
            art/COMPASS-Digital-Twin-*.zip.blockmap \
            art/latest-mac.yml \
            art/COMPASS-Digital-Twin-*.exe \
            art/COMPASS-Digital-Twin-*.exe.blockmap \
            art/latest.yml
          do
            [ -f "$f" ] && assets+=("$f")
          done
          printf 'publishing: %s\n' "${assets[@]}"
          case " ${assets[*]} " in
            *.exe*) win="with the Windows installer" ;;
            *)      win="macOS only — the Windows build did not produce an installer" ;;
          esac
          gh release create "v$VER" \
            --repo Urology-AI/digital-twin-releases \
            --title "$VER" --notes "Automated release. macOS signed, notarized, stapled; $win." \
            "${assets[@]}"
          echo "::notice::Published v$VER ($win)"
