name: Release macOS app

# Triggered by a `vX.Y.Z` tag — pushed by hand, by `npm version patch`, or
# automatically by auto-release.yml on every merge to main that touches app
# code. The build version comes from the tag, not package.json.
# Run manually (workflow_dispatch) with `preflight` to only check the
# signing/notarization secrets without building.
#
# Three jobs: build (sign + notarize + staple on macos-14), verify (cold
# Gatekeeper check on a SEPARATE macos-15 runner that never touched the
# notarization — so its verdict reflects what a user's Mac sees, not a warm
# local cache), publish (only if verify passed).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      preflight:
        description: "Only check secrets, don't build"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-14
    outputs:
      ver: ${{ steps.ver.outputs.v }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — validate signing & notarization secrets
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASES_WRITE_PAT: ${{ secrets.RELEASES_WRITE_PAT }}
          RELEASES_READ_PAT: ${{ secrets.RELEASES_READ_PAT }}
        run: |
          set -e
          fail=0
          for v in MAC_CERT_P12 MAC_CERT_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID RELEASES_WRITE_PAT RELEASES_READ_PAT; do
            if [ -z "${!v}" ]; then echo "::error::$v is empty"; fail=1; else echo "$v: set"; fi
          done
          [ "$fail" = 0 ] || exit 1

          echo "$MAC_CERT_P12" | base64 --decode > cert.p12
          echo "cert.p12 size: $(wc -c < cert.p12) bytes"
          # Validates both that the .p12 is well-formed and that MAC_CERT_PASSWORD is correct.
          openssl pkcs12 -in cert.p12 -nodes -passin env:MAC_CERT_PASSWORD -clcerts 2>/dev/null \
            | openssl x509 -noout -subject -enddate
          echo "→ certificate + password OK"

          # Confirms APPLE_ID / app-specific password / team id are accepted by Apple.
          xcrun notarytool history --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            | head -5
          echo "→ notarization credentials OK"
          rm cert.p12

          # Confirms both release-repo tokens can reach the private repo.
          for pat in RELEASES_WRITE_PAT RELEASES_READ_PAT; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${!pat}" \
              https://api.github.com/repos/Urology-AI/digital-twin-releases)
            [ "$code" = 200 ] && echo "→ $pat reaches digital-twin-releases OK" \
              || { echo "::error::$pat cannot read digital-twin-releases (HTTP $code)"; exit 1; }
          done

          # The auto-updater doesn't read repo metadata — it lists releases and
          # then downloads latest-mac.yml as an asset blob. Exercise that exact
          # path with the read token that gets baked into the app, so a token
          # that can see the repo but not its releases/assets fails here, not
          # silently in the field as "Update check failed".
          rel=$(curl -s -H "Authorization: Bearer $RELEASES_READ_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Urology-AI/digital-twin-releases/releases/latest)
          asset=$(echo "$rel" | python3 -c 'import json,sys;r=json.load(sys.stdin);print(next((a["url"] for a in r.get("assets",[]) if a["name"]=="latest-mac.yml"),""))')
          [ -n "$asset" ] || { echo "::error::RELEASES_READ_PAT: no latest-mac.yml on the latest release ($(echo "$rel" | head -c 200))"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -L \
            -H "Authorization: Bearer $RELEASES_READ_PAT" \
            -H "Accept: application/octet-stream" "$asset")
          [ "$code" = 200 ] && echo "→ RELEASES_READ_PAT can download the update feed OK" \
            || { echo "::error::RELEASES_READ_PAT cannot download latest-mac.yml (HTTP $code)"; exit 1; }

      - name: Stop here if preflight-only
        if: ${{ inputs.preflight }}
        run: echo "Preflight passed. Re-run without preflight (or push a tag) to build." && exit 0

      - uses: actions/setup-node@v4
        if: ${{ !inputs.preflight }}
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: ${{ !inputs.preflight }}

      - run: npm run typecheck && npm test
        if: ${{ !inputs.preflight }}

      - name: Resolve version
        if: ${{ !inputs.preflight }}
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(node -p 'require("./package.json").version')"
          fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"

      - name: Write the baked-in update token
        if: ${{ !inputs.preflight }}
        run: |
          printf '{"token":"%s"}' "${{ secrets.RELEASES_READ_PAT }}" > electron/update-auth.json

      # `hdiutil create` is flaky on GitHub's macOS runners while Spotlight is
      # indexing the freshly-checked-out tree; disabling it makes the DMG build
      # reliable.
      - name: Disable Spotlight (hdiutil reliability)
        if: ${{ !inputs.preflight }}
        run: sudo mdutil -a -i off || true

      - name: Build, sign, notarize, staple
        if: ${{ !inputs.preflight }}
        run: |
          for attempt in 1 2 3; do
            echo "::group::electron-builder attempt $attempt"
            npm run dist:mac -- --publish never -c.extraMetadata.version=${{ steps.ver.outputs.v }} && { echo "::endgroup::"; ok=1; break; }
            echo "::endgroup::"
            echo "attempt $attempt failed; cleaning up and retrying in 20s"
            rm -rf release
            hdiutil info | grep -o '/Volumes/COMPASS[^"]*' | while read -r v; do hdiutil detach "$v" -force || true; done
            sleep 20
          done
          [ "$ok" = 1 ] || exit 1
        env:
          VITE_APP_VERSION: ${{ steps.ver.outputs.v }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload release artifacts
        if: ${{ !inputs.preflight }}
        uses: actions/upload-artifact@v4
        with:
          name: release-mac
          if-no-files-found: error
          path: |
            release/COMPASS-Digital-Twin-*-arm64.dmg
            release/COMPASS-Digital-Twin-*-arm64.zip
            release/COMPASS-Digital-Twin-*-arm64.zip.blockmap
            release/latest-mac.yml

  # Cold Gatekeeper check on a runner that never performed the notarization,
  # with Apple's online notarization endpoints blocked — so `stapler` and
  # `spctl` can only succeed from an embedded (stapled) ticket, exactly like a
  # user's Mac opening the download offline. The old in-job check passed off a
  # warm local cache and shipped un-notarized builds for three releases.
  verify:
    needs: build
    if: ${{ !inputs.preflight }}
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-mac
          path: art

      - name: Block Apple's online notarization endpoints
        run: |
          sudo tee -a /etc/hosts >/dev/null <<'EOF'
          0.0.0.0 valid.apple.com
          0.0.0.0 api.apple-cloudkit.com
          0.0.0.0 ocsp.apple.com
          0.0.0.0 ocsp2.apple.com
          EOF
          sudo dscacheutil -flushcache || true
          sudo killall -HUP mDNSResponder || true

      - name: Verify .dmg and .zip are notarized + stapled (offline)
        run: |
          set -e
          VER="${{ needs.build.outputs.ver }}"
          DMG="art/COMPASS-Digital-Twin-$VER-arm64.dmg"
          ZIP="art/COMPASS-Digital-Twin-$VER-arm64.zip"

          echo "::group::.dmg — the disk image itself"
          xcrun stapler validate "$DMG"
          # Informational: an unsigned-but-notarized image has no primary
          # signature for spctl to report on; the authoritative checks are on
          # the .app below.
          spctl -a -vvv -t open "$DMG" || true
          echo "::endgroup::"

          echo "::group::.dmg — the .app inside"
          MP=$(mktemp -d)
          hdiutil attach -nobrowse -quiet -mountpoint "$MP" "$DMG"
          WORK=$(mktemp -d); cp -R "$MP"/*.app "$WORK/"; hdiutil detach "$MP" -quiet
          APP=$(find "$WORK" -maxdepth 1 -name "*.app" -print -quit)
          xcrun stapler validate "$APP"
          spctl -a -vvv -t exec "$APP"
          codesign --test-requirement="=notarized" --verify --verbose=2 "$APP"
          echo "::endgroup::"

          echo "::group::.zip — the .app the auto-updater installs"
          UZ=$(mktemp -d); ditto -x -k "$ZIP" "$UZ"
          ZAPP=$(find "$UZ" -maxdepth 1 -name "*.app" -print -quit)
          xcrun stapler validate "$ZAPP"
          spctl -a -vvv -t exec "$ZAPP"
          codesign --test-requirement="=notarized" --verify --verbose=2 "$ZAPP"
          echo "::endgroup::"

          echo "→ v$VER: .dmg and .zip are signed, notarized and stapled (offline-verified on a cold runner)"

  publish:
    needs: [build, verify]
    if: ${{ !inputs.preflight }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-mac
          path: art

      - name: Publish to the private releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_WRITE_PAT }}
        run: |
          set -e
          VER="${{ needs.build.outputs.ver }}"
          gh release delete "v$VER" --repo Urology-AI/digital-twin-releases --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$VER" \
            --repo Urology-AI/digital-twin-releases \
            --title "$VER" --notes "Automated release. Signed, notarized, stapled." \
            art/COMPASS-Digital-Twin-*.dmg \
            art/COMPASS-Digital-Twin-*.zip \
            art/COMPASS-Digital-Twin-*.zip.blockmap \
            art/latest-mac.yml
          echo "::notice::Published v$VER"
