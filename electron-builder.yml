appId: ai.urology.compass-digital-twin
productName: COMPASS Digital Twin
copyright: Mount Sinai — IRB STUDY-14-00050. Research use only.

directories:
  output: release
  buildResources: electron

files:
  - electron/**/*
  - package.json

# The web build ships as a plain resource directory, not inside app.asar.
# (Unpacking a large asset tree from the asar via asarUnpack leaves an
# app.asar.unpacked/ that breaks notarization stapling on macOS 15+.)
extraResources:
  - from: dist
    to: app-dist

mac:
  icon: electron/icon.icns
  category: public.app-category.medical
  target:
    - dmg
    - zip
  # Explicit (no spaces) so the on-disk name, the uploaded asset name and the
  # names inside latest-mac.yml all match — CI uploads these files directly.
  artifactName: COMPASS-Digital-Twin-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
  # Signing identity is picked up from the keychain, or from CSC_LINK /
  # CSC_KEY_PASSWORD env vars in CI. Notarization (submit + staple the .app)
  # is electron-builder 26's built-in step — needs APPLE_ID,
  # APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID in the environment.
  notarize: true

dmg:
  title: ${productName} ${version}

# Auto-update feed + release hosting. Releases go to a SEPARATE PRIVATE
# repo so the .dmg is never publicly downloadable (this repo is public).
# `npm run dist:mac -- --publish always` (or CI) uploads the dmg, zip and
# latest-mac.yml there; installed apps read that feed with a baked-in
# read-only token (see electron/main.cjs + electron/update-auth.example.json).
publish:
  provider: github
  owner: Urology-AI
  repo: digital-twin-releases
  private: true
